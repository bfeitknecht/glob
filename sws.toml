# static-web-server config. These are the settings that the ENV cannot set.
#
# 1. Cache-Control: no-cache for HTML, XML, and plain documents. The browser asks the server
#    again, and the server answers 304 when the file has not changed.
# 2. A one-year cache for `css/**` (`style.css?v=<fnv1a>`) and for `fonts/**`
#    (`*.woff2?v=<tag>`). The URL changes when the file changes.
# 3. UTF-8 text/plain and nosniff headers for the co-emitted Tadi Web `.typ` files. When a
#    reader opens a `.typ` file, the browser shows the raw Typst source. No MIME sniffing occurs.
[advanced]

[[advanced.headers]]
source = "**"
headers = { Cache-Control = "no-cache" }

[[advanced.headers]]
source = "**/css/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }

[[advanced.headers]]
source = "**/fonts/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }

[[advanced.headers]]
source = "**/*.typ"
headers = { Content-Type = "text/plain; charset=utf-8", Content-Disposition = "inline", X-Content-Type-Options = "nosniff" }
