# static-web-server config — only what ENV cannot express.
#
# 1. Cache-Control: no-cache on HTML/XML/plain documents (revalidate via Last-Modified -> 304).
# 2. Immutable 1-year caching on content-addressed `css/**` (`style.css?v=<fnv1a>`) and
#    version-tagged self-hosted web fonts `fonts/**` (`*.woff2?v=<tag>`).
# 3. Inline UTF-8 text/plain + nosniff headers on co-emitted Tadi Web `.typ` source files so
#    clicking `.typ` renders the raw Typst source directly in the browser tab without MIME sniffing.
[advanced]

[[advanced.headers]]
source = "**"
headers = { Cache-Control = "no-cache" }

[[advanced.headers]]
source = "**/css/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }

[[advanced.headers]]
source = "**/fonts/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }

[[advanced.headers]]
source = "**/*.typ"
headers = { Content-Type = "text/plain; charset=utf-8", Content-Disposition = "inline", X-Content-Type-Options = "nosniff" }
