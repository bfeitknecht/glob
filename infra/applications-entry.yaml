# Append to kubernetes/cluster/applications.yaml in bfeitknecht/infra:
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: glob
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
  interval: 10m0s
  path: ./kubernetes/applications/glob
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  ignore:
    - paths:
        - /spec/template/spec/containers/0/image
      target:
        kind: Deployment
        name: glob
