name: Publish Image

on:
  push:
    tags:
      - "v*" # Runs on tags such as v0.1.0 and v1.0.0.
  # Publish the current HEAD again. This run makes no tag:
  #   gh workflow run publish-image.yaml
  workflow_dispatch:

jobs:
  publish:
    # This repository gives the GITHUB_TOKEN read access only. The called workflow needs
    # `packages: write`, so grant it here.
    permissions:
      contents: read
      packages: write
    # The build and push steps are in the infra repository.
    uses: bfeitknecht/infra/.github/workflows/publish-image.yaml@master
